services:
  flowise:
    ports:
      - 127.0.0.1:3001:3001

  open-webui:
    ports:
      - 127.0.0.1:8080:8080
    environment:
      # ------------------------------------------------------------------
      # tw-stts audio gateway (Taiwanese Mandarin TTS + code-switching STT)
      # Runs natively on the macOS host: MLX needs bare-metal Apple Silicon
      # and Docker Desktop has no GPU passthrough.
      #   repo:  ~/pgit/tw-stts
      #   setup: docs/openwebui-setup.md
      # ------------------------------------------------------------------

      # ---- Speech to text ----
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://host.docker.internal:1235/v1
      - AUDIO_STT_OPENAI_API_KEY=${TW_STTS_API_KEY}
      - AUDIO_STT_MODEL=breeze-asr-25

      # Keep uploads at full fidelity. Without this Open WebUI rewrites audio
      # to 16 kHz mono 32 kbps MP3 and splits it into chunks before sending,
      # which measurably degrades recognition on code-switching speech.
      # It also stops Open WebUI transcoding TTS replies, which is why
      # tw-stts returns MP3 natively.
      - BYPASS_PYDUB_PREPROCESSING=true

      # ---- Text to speech ----
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://host.docker.internal:1235/v1
      - AUDIO_TTS_OPENAI_API_KEY=${TW_STTS_API_KEY}
      - AUDIO_TTS_MODEL=bluemagpie-tts
      - AUDIO_TTS_VOICE=hung_yi_lee
      - AUDIO_TTS_SPLIT_ON=punctuation

  n8n:
    ports:
      - 127.0.0.1:5678:5678

  qdrant:
    ports:
      - 127.0.0.1:6333:6333
      - 127.0.0.1:6334:6334

  neo4j:
    ports:
      - 127.0.0.1:7473:7473
      - 127.0.0.1:7474:7474
      - 127.0.0.1:7687:7687

  langfuse-worker:
    ports:
      - 127.0.0.1:3030:3030

  langfuse-web:
    ports:
      - 127.0.0.1:3000:3000

  clickhouse:
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9009:9009

  minio:
    ports:
      - 127.0.0.1:9010:9000
      - 127.0.0.1:9011:9001

  postgres:
    ports:
      - 127.0.0.1:5433:5432                

  redis:
    ports:
      - 127.0.0.1:6379:6379

  searxng:
    ports:
      - 127.0.0.1:8081:8080
